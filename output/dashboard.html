<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AirOps · Growth Marketing Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --forest: #002910;
      --primary-green: #008c44;
      --interaction-green: #00ff64;
      --accent-label: #EEFF8C;
      --green-100: #dfeae3;
      --green-200: #CCFFE0;
      --off-white: #F8FFFA;
      --near-black: #000d05;
      --text-primary: #09090b;
      --text-secondary: #676c79;
      --text-tertiary: #a5aab6;
      --stroke-primary: #ecedef;
      --stroke-green: #d4e8da;
      --bg-canvas: #f4f4f6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 400;
      padding: 28px 32px;
    }
    .mono { font-family: "DM Mono", monospace; }

    /* Top bar */
    .topbar { display: grid; grid-template-columns: 80px 1fr; gap: 12px; align-items: center; margin-bottom: 12px; }
    .logo-tile {
      width: 80px; height: 64px;
      background: var(--forest);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      padding: 8px;
    }
    .logo-tile img { max-width: 100%; max-height: 100%; }
    .title-tile {
      background: #fff;
      border-radius: 10px;
      padding: 18px 22px;
      font-family: "Inter Tight", sans-serif;
      font-weight: 600;
      font-size: 20px;
      color: var(--near-black);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .date-pill {
      background: #fff;
      border-radius: 10px;
      padding: 18px 22px;
      font-family: "Inter Tight", sans-serif;
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .date-pill strong { color: var(--near-black); font-weight: 600; }

    /* Filter bar */
    .filter-bar {
      background: #fff;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: repeat(6, 1fr) auto;
      gap: 14px;
      align-items: end;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field label {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .field input,
    .field select {
      font-family: "Inter Tight", sans-serif;
      font-size: 13px;
      color: var(--text-primary);
      padding: 8px 10px;
      border: 1px solid var(--stroke-primary);
      border-radius: 7px;
      background: #fff;
      outline: none;
      width: 100%;
    }
    .field input:focus, .field select:focus { border-color: var(--primary-green); box-shadow: 0 0 0 3px var(--green-200); }
    .field select[multiple] { min-height: 38px; max-height: 110px; }
    .reset-btn {
      font-family: "Inter Tight", sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 16px;
      background: var(--near-black);
      color: #fff;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      height: fit-content;
    }
    .reset-btn:hover { background: var(--primary-green); }

    /* KPI tiles */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }
    .kpi {
      background: #fff;
      border-radius: 10px;
      padding: 18px 20px;
      min-height: 98px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .kpi .v {
      font-family: "Inter Tight", sans-serif;
      font-weight: 600;
      font-size: 30px;
      color: var(--near-black);
      line-height: 1.05;
      letter-spacing: -0.01em;
    }
    .kpi .l {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    /* Tables */
    .table-card {
      background: #fff;
      border-radius: 12px;
      padding: 18px 22px;
      margin-bottom: 18px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .table-card h2 { font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: 16px; margin: 0 0 4px; }
    .table-card .sub { color: var(--text-secondary); font-size: 12px; margin-bottom: 14px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 13px; }
    thead th {
      text-align: right;
      font-family: "Inter Tight", sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--near-black);
      background: var(--bg-canvas);
      padding: 12px 14px;
      border: 0;
    }
    thead th:first-child { text-align: left; border-radius: 7px 0 0 7px; }
    thead th:last-child { border-radius: 0 7px 7px 0; }
    tbody td {
      text-align: right;
      padding: 12px 14px;
      background: var(--bg-canvas);
      color: var(--text-primary);
      border: 0;
    }
    tbody td:first-child { text-align: left; border-radius: 7px 0 0 7px; font-weight: 500; }
    tbody td:last-child { border-radius: 0 7px 7px 0; }
    tbody tr:hover td { background: #ebebed; }
    .muted { color: var(--text-tertiary); }
    .pos { color: var(--primary-green); font-weight: 500; }
    .neg { color: #c0392b; font-weight: 500; }

    @media (max-width: 1240px) {
      .filter-bar { grid-template-columns: repeat(3, 1fr); }
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 720px) {
      body { padding: 16px; }
      .filter-bar { grid-template-columns: 1fr 1fr; }
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .topbar { grid-template-columns: 60px 1fr; }
      .date-pill { grid-column: 1 / -1; }
    }
  </style>
</head>

  <div class="logo-tile">
    <img src="https://cdn.airops.com/rails/active_storage/blobs/proxy/eyJfcmFpbHMiOnsiZGF0YSI6MTc3NzE3NTkzLCJwdXIiOiJibG9iX2lkIn19--e377642a60a472285a3ec5430e5a26157548328c/airops-logo-on-forest.svg" alt="AirOps">

</div>

<div class="filter-bar" style="display:grid; grid-template-columns: 1fr 1fr 1.5fr 1.5fr auto; gap:16px; align-items:start; padding:16px 20px;">
  <div style="display:flex; flex-direction:column; gap:12px;">
    <div class="field">
      <label for="filter-groupby">Grouped By</label>
      <select id="filter-groupby">
        <option value="create_date">Create Date</option>
        <option value="event_date">Event Date</option>
      </select>
    </div>
    <div class="field">
      <label for="filter-from">From</label>
      <input type="date" id="filter-from">
    </div>
    <div class="field">
      <label for="filter-to">To</label>

    </div>
  </div>
  <div class="field">

    <div id="filter-source" class="checkbox-group" style="display:flex; flex-direction:column; gap:6px; padding:10px 12px; border:1px solid var(--stroke-primary); border-radius:7px; background:#fff; min-height:38px;"></div>
  </div>
  <div class="field">
    <label>Deal Channel</label>
    <div id="filter-channel" class="checkbox-group" style="display:flex; flex-direction:column; gap:6px; padding:10px 12px; border:1px solid var(--stroke-primary); border-radius:7px; background:#fff; min-height:38px; max-height:200px; overflow-y:auto;"></div>
  </div>
  <div class="field">
    <label>Deal Sub-Channel</label>
    <div id="filter-subchannel" class="checkbox-group" style="display:flex; flex-direction:column; gap:6px; padding:10px 12px; border:1px solid var(--stroke-primary); border-radius:7px; background:#fff; min-height:38px; max-height:200px; overflow-y:auto;"></div>
  </div>
  <button class="reset-btn" id="filter-reset" style="align-self:start;">Reset</button>
</div>

</div>

<div class="kpi-grid">

        <label style="display:flex; align-items:center; gap:5px; font-size:12px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--text-primary); cursor:pointer;"><input type="checkbox" name="pivot-metric" value="arr"> ARR</label>
        <label style="display:flex; align-items:center; gap:5px; font-size:12px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--text-primary); cursor:pointer;"><input type="checkbox" name="pivot-metric" value="MQL_S1"> MQL→S1</label>
        <label style="display:flex; align-items:center; gap:5px; font-size:12px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--text-primary); cursor:pointer;"><input type="checkbox" name="pivot-metric" value="S1_S2"> S1→S2</label>
        <label style="display:flex; align-items:center; gap:5px; font-size:12px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--text-primary); cursor:pointer;"><input type="checkbox" name="pivot-metric" value="S2_CW"> S2→CW</label>
        <label style="display:flex; align-items:center; gap:5px; font-size:12px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--text-primary); cursor:pointer;"><input type="checkbox" name="pivot-metric" value="ROI"> ROI</label>

    </div>
    <div class="field">
      <label for="pivot-freq">Frequency</label>

        <option value="week" selected>Weekly</option>

    </div>
    <div class="field" style="min-width:240px; flex:1;">

    </div>
  </div>

</div>

    </div>
    <div class="field">
      <label for="drill-window">Compare</label>
      <select id="drill-window" style="padding:8px 10px; border:1px solid var(--stroke-primary); border-radius:7px; font-size:13px;">

        <option value="mom">Latest month vs prior month</option>
        <option value="all">All weeks aggregated</option>
      </select>
    </div>
  </div>
  <div id="drill-table"></div>
</div>

<script>
  const raw = document.getElementById('dashboard-data').textContent;
  const json = raw.replace(/\/\* DASHBOARD_DATA_START \*\//, '').replace(/\/\* DASHBOARD_DATA_END \*\//, '').trim();
  const data = JSON.parse(json);

  // Canonical HubSpot taxonomies (deal_channel, deal_source_2024 enums).
  const HUBSPOT_DEAL_CHANNELS_SET = new Set([
    'Outbound', 'Event / Conference', 'Affiliate', 'AI Search',
    'Community / Influencer', 'Direct', 'Email', 'Offline Advertising',
    'Organic Search', 'Organic Social', 'Paid AI Search', 'Paid Display',
    'Paid Search', 'Paid Social', 'Referral', 'Other',
  ]);

  // Remap any non-HubSpot deal_channel value to "Other" so the dashboard always
  // shows the canonical 16-value taxonomy.
  data.rows.forEach(r => {
    if (!r.deal_channel || !HUBSPOT_DEAL_CHANNELS_SET.has(r.deal_channel)) {
      r.deal_channel = 'Other';
    }
    r.source = (r.deal_channel === 'Outbound') ? 'Outbound' : 'Inbound';
  });

  function num(x) { if (x === null || x === undefined || Number.isNaN(x)) return '—'; return Number(x).toLocaleString(); }
  function money(x) { if (x === null || x === undefined || Number.isNaN(x)) return '—'; return '$' + Number(x).toLocaleString(undefined, { maximumFractionDigits: 0 }); }
  function pct(x) { if (x === null || x === undefined || Number.isNaN(x)) return '—'; return (x * 100).toFixed(2) + '%'; }
  function delta(x) { if (x === null || x === undefined || Number.isNaN(x)) return '<span class="muted">—</span>'; const cls = x >= 0 ? 'pos' : 'neg'; return '<span class="' + cls + '">' + (x > 0 ? '+' : '') + (x * 100).toFixed(1) + '%</span>'; }

  // Canonical HubSpot taxonomies (deal_channel, deal_source_2024 enums)
  const HUBSPOT_DEAL_CHANNELS = [
    'Outbound', 'Event / Conference', 'Affiliate', 'AI Search',
    'Community / Influencer', 'Direct', 'Email', 'Offline Advertising',
    'Organic Search', 'Organic Social', 'Paid AI Search', 'Paid Display',
    'Paid Search', 'Paid Social', 'Referral', 'Other',
  ];
  const HUBSPOT_DEAL_SUB_CHANNELS = [
    'Inbound - Network Referral [Name]', 'Inbound - Customer Referral [Name]',
    'Inbound - Partner Referral: [Name]', 'Inbound – Partner Co-Marketing',
    'Inbound - Referral / WOM', 'Inbound - Webinar', 'Inbound - LinkedIn',
    'Inbound - Affiliate', 'Inbound - Community / Newsletter / Influencer',
    'Inbound - Content / SEO / LLMs', 'Enablement - Cohort',
    'Outbound - LinkedIn Dripify Sequence', 'Outbound - Conference',
    'Outbound - Founder Connection', 'Outbound - Email Sequence',
    'Outbound - Event/Dinner Program', 'Outbound - GTN LI Outreach',
    'Product-Led Opp - Intercom', 'Product-Led Opp - Builder Slack',
    'Product-Led Opp - Email Sequence', 'LLM', 'ChatGPT', 'Bing',
    'Growth Unhinged', 'Meta', 'Hubspot Automation', 'G2',
    'Inbound - Other', 'Unknown', 'Phone Call',
  ];

  // Build filter dropdowns
  const allSources = ['Inbound', 'Outbound'];
  const allChannels = HUBSPOT_DEAL_CHANNELS;
  const allSubChannels = HUBSPOT_DEAL_SUB_CHANNELS;
  const allWeeks = Array.from(new Set(data.rows.map(r => r.week).filter(Boolean))).sort();
  const minWeek = allWeeks[0];
  const maxWeek = allWeeks[allWeeks.length - 1];

  function fillSelect(sel, opts) {
    sel.innerHTML = '';
    opts.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); });
  }
  function fillCheckboxes(container, name, opts) {
    container.innerHTML = '';
    opts.forEach(v => {
      const lbl = document.createElement('label');
      lbl.style.cssText = 'display:flex; align-items:center; justify-content:flex-start; width:100%; gap:8px; font-size:12px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--text-primary); cursor:pointer; white-space:nowrap; text-align:left;';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.name = name;
      cb.value = v;
      cb.style.cssText = 'flex:0 0 auto; margin:0;';
      lbl.appendChild(cb);
      const span = document.createElement('span');
      span.textContent = v;
      span.style.cssText = 'flex:1; text-align:left;';
      lbl.appendChild(span);
      container.appendChild(lbl);
    });
  }
  const sourceSel = document.getElementById('filter-source');
  const channelSel = document.getElementById('filter-channel');
  const subSel = document.getElementById('filter-subchannel');
  fillCheckboxes(sourceSel, 'cb-source', allSources);
  fillCheckboxes(channelSel, 'cb-channel', allChannels);
  fillCheckboxes(subSel, 'cb-subchannel', allSubChannels);
  const pivotChanSel = document.getElementById('pivot-channels');
  if (pivotChanSel) fillCheckboxes(pivotChanSel, 'cb-pivot-channel', allChannels);

  const fromInput = document.getElementById('filter-from');
  const toInput = document.getElementById('filter-to');
  if (minWeek) { fromInput.value = minWeek; fromInput.min = minWeek; fromInput.max = maxWeek; }
  if (maxWeek) { toInput.value = maxWeek; toInput.min = minWeek; toInput.max = maxWeek; }

  function selected(sel) {
    if (sel && sel.classList && sel.classList.contains('checkbox-group')) {
      return Array.from(sel.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value);
    }
    return Array.from(sel.selectedOptions).map(o => o.value);
  }

  function getFiltered() {
    const from = fromInput.value;
    const to = toInput.value;
    const srcs = selected(sourceSel);
    const chans = selected(channelSel);
    const subs = selected(subSel);
    return data.rows.filter(r => {
      if (from && r.week && r.week < from) return false;
      if (to && r.week && r.week > to) return false;
      if (srcs.length && !srcs.includes(r.source)) return false;
      if (chans.length && !chans.includes(r.deal_channel)) return false;
      if (subs.length && !subs.includes(r.deal_sub_channel)) return false;
      return true;
    });
  }

  function totals(rows) {
    const t = { impressions: 0, clicks: 0, spend: 0, leads: 0, mqls: 0, s1: 0, s2: 0, cw: 0, arr: 0 };
    rows.forEach(r => {
      t.impressions += r.impressions || 0;
      t.clicks += r.clicks || 0;
      t.spend += r.spend || 0;
      t.leads += r.leads || 0;
      t.mqls += r.mqls || 0;
      t.s1 += r.s1 || 0;
      t.s2 += r.s2 || 0;
      t.cw += r.cw || 0;
      t.arr += r.arr || 0;
    });
    // Oppty pipeline = pipeline value from S1+S2 stages (we approximate using arr field as deal amount sum).
    // For a proper "pipeline value" we'd want sum of amount across all open deals; using arr (closed-won amount) is a placeholder.
    t.oppty_pipeline = t.arr; // TODO: sum amount across S1+S2 stages once exposed
    t.CTR = t.impressions ? t.clicks / t.impressions : null;
    t.MQL_CVR = t.clicks ? t.mqls / t.clicks : null;
    t.Lead_MQL = t.leads ? t.mqls / t.leads : null;
    t.MQL_S1 = t.mqls ? t.s1 / t.mqls : null;
    t.S1_S2 = t.s1 ? t.s2 / t.s1 : null;
    t.S2_CW = t.s2 ? t.cw / t.s2 : null;
    t.CPMQL = t.mqls ? t.spend / t.mqls : null;
    t.CPS1 = t.s1 ? t.spend / t.s1 : null;
    t.CPS2 = t.s2 ? t.spend / t.s2 : null;
    t.CPCW = t.cw ? t.spend / t.cw : null;
    t.ROI = t.spend ? t.arr / t.spend : null;
    return t;
  }

  function renderKPIs(t) {
    document.getElementById('kpi-cost').textContent = money(t.spend);
    document.getElementById('kpi-impr').textContent = num(t.impressions);
    document.getElementById('kpi-clicks').textContent = num(t.clicks);
    document.getElementById('kpi-lead').textContent = num(t.leads);
    document.getElementById('kpi-mql').textContent = num(t.mqls);
    document.getElementById('kpi-demo').textContent = num(t.s1);
    document.getElementById('kpi-oppty').textContent = num(t.s2);
    document.getElementById('kpi-ctr').textContent = pct(t.CTR);
    document.getElementById('kpi-mqlcvr').textContent = pct(t.MQL_CVR);
    document.getElementById('kpi-mqldemo').textContent = pct(t.MQL_S1);
    document.getElementById('kpi-s1s2').textContent = pct(t.S1_S2);
    document.getElementById('kpi-s2cw').textContent = pct(t.S2_CW);
    document.getElementById('kpi-cw').textContent = num(t.cw);
    document.getElementById('kpi-s2amt').textContent = money(t.s2_amount || 0);
    document.getElementById('kpi-cwarr').textContent = money(t.arr || 0);
    document.getElementById('kpi-cpmql').textContent = money(t.CPMQL);
    document.getElementById('kpi-cps1').textContent = money(t.CPS1);
    document.getElementById('kpi-cps2').textContent = money(t.CPS2);
    document.getElementById('kpi-cpcw').textContent = money(t.CPCW);
    document.getElementById('kpi-roi').textContent = t.ROI === null ? '—' : Number(t.ROI).toFixed(2) + 'x';
  }

  function aggBy(rows, keyFn) {
    const map = new Map();
    rows.forEach(r => {
      const k = keyFn(r);
      if (!map.has(k)) map.set(k, { key: k, impressions: 0, clicks: 0, spend: 0, leads: 0, mqls: 0, s1: 0, s2: 0, cw: 0, arr: 0 });
      const a = map.get(k);
      a.impressions += r.impressions || 0;
      a.clicks += r.clicks || 0;
      a.spend += r.spend || 0;
      a.leads += r.leads || 0;
      a.mqls += r.mqls || 0;
      a.s1 += r.s1 || 0;
      a.s2 += r.s2 || 0;
      a.cw += r.cw || 0;
      a.arr += r.arr || 0;
    });
    map.forEach(a => {
      a.CTR = a.impressions ? a.clicks / a.impressions : null;
      a.MQL_CVR = a.clicks ? a.mqls / a.clicks : null;
      a.Lead_MQL = a.leads ? a.mqls / a.leads : null;
      a.MQL_S1 = a.mqls ? a.s1 / a.mqls : null;
      a.S1_S2 = a.s1 ? a.s2 / a.s1 : null;
      a.S2_CW = a.s2 ? a.cw / a.s2 : null;
      a.MQL_Demo = a.mqls ? a.s2 / a.mqls : null;
      a.Cost_per_MQL = a.mqls ? a.spend / a.mqls : null;
      a.CpCW = a.cw ? a.spend / a.cw : null;
      a.ROI = a.spend ? a.arr / a.spend : null;
    });
    return Array.from(map.values());
  }

  let funnelSort = { col: 'spend', dir: 'desc' };
  let _funnelLastRows = [];
  function renderFunnelTable(rows) {
    _funnelLastRows = rows;
    const agg = aggBy(rows, r => r.deal_channel || '—');
    const cols = [
      { key: 'key', label: 'Deal Channel', fmt: v => v, type: 'str' },
      { key: 'spend', label: 'Cost', fmt: money, type: 'num' },
      { key: 'impressions', label: 'Impr.', fmt: num, type: 'num' },
      { key: 'clicks', label: 'Clicks', fmt: num, type: 'num' },
      { key: 'CTR', label: 'CTR', fmt: pct, type: 'num' },
      { key: 'leads', label: 'Lead', fmt: num, type: 'num' },
      { key: 'Lead_MQL', label: 'Lead→MQL', fmt: pct, type: 'num' },
      { key: 'mqls', label: 'MQL', fmt: num, type: 'num' },
      { key: 's1', label: 'S1', fmt: num, type: 'num' },
      { key: 'MQL_S1', label: 'MQL→S1', fmt: pct, type: 'num' },
      { key: 's2', label: 'S2', fmt: num, type: 'num' },
      { key: 'S1_S2', label: 'S1→S2', fmt: pct, type: 'num' },
      { key: 'cw', label: 'CW', fmt: num, type: 'num' },
      { key: 'S2_CW', label: 'S2→CW', fmt: pct, type: 'num' },
      { key: 'ROI', label: 'ROI', fmt: v => v === null ? '—' : Number(v).toFixed(2) + 'x', type: 'num' },
    ];
    const sortKey = funnelSort.col;
    const dir = funnelSort.dir === 'asc' ? 1 : -1;
    agg.sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (av === null || av === undefined) return 1;
      if (bv === null || bv === undefined) return -1;
      if (typeof av === 'string') return av.localeCompare(bv) * dir;
      return (av - bv) * dir;
    });
    const head = cols.map(c => {
      const arrow = funnelSort.col === c.key ? (funnelSort.dir === 'asc' ? ' ↑' : ' ↓') : '';
      return `<th data-col="${c.key}" style="cursor:pointer; user-select:none;">${c.label}${arrow}</th>`;
    }).join('');
    const body = agg.map(r => '<tr>' + cols.map(c => `<td>${c.fmt(r[c.key])}</td>`).join('') + '</tr>').join('');

    // Totals row across all channels in current view
    const tot = { key: 'TOTAL', impressions: 0, clicks: 0, spend: 0, leads: 0, mqls: 0, s1: 0, s2: 0, cw: 0, arr: 0 };
    agg.forEach(r => { ['impressions','clicks','spend','leads','mqls','s1','s2','cw','arr'].forEach(k => tot[k] += r[k] || 0); });
    tot.CTR = tot.impressions ? tot.clicks / tot.impressions : null;
    tot.Lead_MQL = tot.leads ? tot.mqls / tot.leads : null;
    tot.MQL_S1 = tot.mqls ? tot.s1 / tot.mqls : null;
    tot.S1_S2 = tot.s1 ? tot.s2 / tot.s1 : null;
    tot.S2_CW = tot.s2 ? tot.cw / tot.s2 : null;
    tot.ROI = tot.spend ? tot.arr / tot.spend : null;
    const totalsRow = '<tr style="background:var(--green-100); font-weight:600;">' +
      cols.map(c => `<td style="font-weight:600;">${c.fmt(tot[c.key])}</td>`).join('') + '</tr>';

    document.getElementById('funnel-table').innerHTML =
      `<table><thead><tr>${head}</tr></thead><tbody>${body || '<tr><td colspan="15" class="muted">No rows match the current filters.</td></tr>'}${agg.length ? totalsRow : ''}</tbody></table>`;
  }
  // Event delegation: one listener attached once that survives innerHTML rewrites
  document.getElementById('funnel-table').addEventListener('click', (e) => {
    const th = e.target.closest('th[data-col]');
    if (!th) return;
    const c = th.getAttribute('data-col');
    if (funnelSort.col === c) funnelSort.dir = funnelSort.dir === 'asc' ? 'desc' : 'asc';
    else { funnelSort.col = c; funnelSort.dir = 'desc'; }
    renderFunnelTable(_funnelLastRows);
  });

  function renderDrillDown(rows) {
    const drillCh = document.getElementById('drill-channel').value;
    const drillWin = document.getElementById('drill-window').value;
    const drillRows = drillCh === 'ALL' ? rows : rows.filter(r => r.deal_channel === drillCh);

    if (!drillRows.length) {
      document.getElementById('drill-table').innerHTML = '<div class="muted">No rows for this Deal Channel within current filters.</div>';
      return;
    }

    // Determine current + prior buckets based on drillWin
    let currentSet, priorSet;
    if (drillWin === 'all') {
      currentSet = drillRows;
      priorSet = [];
    } else {
      const periods = Array.from(new Set(drillRows.map(r => drillWin === 'mom' ? monthOf(r.week) : r.week).filter(Boolean))).sort();
      const cur = periods[periods.length - 1];
      const prev = periods[periods.length - 2];
      currentSet = drillRows.filter(r => (drillWin === 'mom' ? monthOf(r.week) : r.week) === cur);
      priorSet = prev ? drillRows.filter(r => (drillWin === 'mom' ? monthOf(r.week) : r.week) === prev) : [];
    }

    function aggBySub(set) {
      const m = new Map();
      set.forEach(r => {
        const k = r.deal_sub_channel || '—';
        if (!m.has(k)) m.set(k, { sub: k, spend: 0, clicks: 0, impressions: 0, mqls: 0, s1: 0, s2: 0, cw: 0, arr: 0 });
        const a = m.get(k);
        ['spend', 'clicks', 'impressions', 'mqls', 's1', 's2', 'cw', 'arr'].forEach(kk => a[kk] += r[kk] || 0);
      });
      return m;
    }
    const cur = aggBySub(currentSet);
    const prior = aggBySub(priorSet);

    function metricsFor(c) {
      return {
        spend: c.spend, clicks: c.clicks, mqls: c.mqls, s1: c.s1, s2: c.s2, cw: c.cw,
        CTR: c.impressions ? c.clicks / c.impressions : null,
        Lead_MQL: null, // contacts not segmented by sub-channel
        MQL_S1: c.mqls ? c.s1 / c.mqls : null,
        S1_S2: c.s1 ? c.s2 / c.s1 : null,
        CPMQL: c.mqls ? c.spend / c.mqls : null,
        CPS1: c.s1 ? c.spend / c.s1 : null,
        ROI: c.spend ? c.arr / c.spend : null,
      };
    }
    function deltaPct(curV, priorV) {
      if (curV == null || priorV == null || priorV === 0) return null;
      return (curV - priorV) / priorV;
    }

    const subKeys = Array.from(new Set([...cur.keys(), ...prior.keys()])).sort();
    const headers = drillWin === 'all'
      ? ['Sub-Channel', 'Cost', 'Clicks', 'MQL', 'S1', 'S2', 'CW', 'CPMQL', 'CPS1', 'MQL→S1', 'S1→S2', 'ROI']
      : ['Sub-Channel', 'Cost', 'Δ Cost', 'MQL', 'Δ MQL', 'S1', 'Δ S1', 'S2', 'Δ S2', 'CPS1', 'Δ CPS1', 'MQL→S1', 'Δ MQL→S1'];

    const body = subKeys.map(k => {
      const c = cur.get(k) || { spend: 0, clicks: 0, impressions: 0, mqls: 0, s1: 0, s2: 0, cw: 0, arr: 0 };
      const p = prior.get(k) || { spend: 0, clicks: 0, impressions: 0, mqls: 0, s1: 0, s2: 0, cw: 0, arr: 0 };
      const cm = metricsFor(c);
      const pm = metricsFor(p);
      if (drillWin === 'all') {
        return `<tr>
          <td>${k}</td>
          <td>${money(cm.spend)}</td>
          <td>${num(cm.clicks)}</td>
          <td>${num(cm.mqls)}</td>
          <td>${num(cm.s1)}</td>
          <td>${num(cm.s2)}</td>
          <td>${num(cm.cw)}</td>
          <td>${money(cm.CPMQL)}</td>
          <td>${money(cm.CPS1)}</td>
          <td>${pct(cm.MQL_S1)}</td>
          <td>${pct(cm.S1_S2)}</td>
          <td>${cm.ROI === null ? '—' : Number(cm.ROI).toFixed(2) + 'x'}</td>
        </tr>`;
      }
      return `<tr>
        <td>${k}</td>
        <td>${money(cm.spend)}</td>
        <td>${delta(deltaPct(cm.spend, pm.spend))}</td>
        <td>${num(cm.mqls)}</td>
        <td>${delta(deltaPct(cm.mqls, pm.mqls))}</td>
        <td>${num(cm.s1)}</td>
        <td>${delta(deltaPct(cm.s1, pm.s1))}</td>
        <td>${num(cm.s2)}</td>
        <td>${delta(deltaPct(cm.s2, pm.s2))}</td>
        <td>${money(cm.CPS1)}</td>
        <td>${delta(deltaPct(cm.CPS1, pm.CPS1))}</td>
        <td>${pct(cm.MQL_S1)}</td>
        <td>${delta(deltaPct(cm.MQL_S1, pm.MQL_S1))}</td>
      </tr>`;
    }).join('');

    let label = '';
    if (drillWin === 'wow') {
      const periods = Array.from(new Set(drillRows.map(r => r.week).filter(Boolean))).sort();
      label = periods.length >= 2 ? `Latest week ${periods[periods.length-1]} vs ${periods[periods.length-2]}` : `Only ${periods[0] || '—'}`;
    } else if (drillWin === 'mom') {
      const periods = Array.from(new Set(drillRows.map(r => monthOf(r.week)).filter(Boolean))).sort();
      label = periods.length >= 2 ? `Latest month ${periods[periods.length-1]} vs ${periods[periods.length-2]}` : `Only ${periods[0] || '—'}`;
    } else {
      label = `All weeks aggregated · ${drillRows.length} rows`;
    }

    document.getElementById('drill-table').innerHTML =
      `<div class="muted" style="margin-bottom:8px; font-size:12px;">${drillCh} · ${label}</div>` +
      `<table><thead><tr>${headers.map(h => '<th>' + h + '</th>').join('')}</tr></thead><tbody>${body}</tbody></table>`;
  }

  function monthOf(week) { return week ? week.slice(0, 7) : ''; }

  const METRIC_LABELS = {
    spend: 'Cost', impressions: 'Impressions', clicks: 'Clicks',
    mqls: 'MQL', s1: 'S1', s2: 'S2', cw: 'CW', arr: 'ARR',
    MQL_S1: 'MQL → S1 CVR', S1_S2: 'S1 → S2 CVR', S2_CW: 'S2 → CW CVR', ROI: 'ROI',
  };
  function metricVal(c, metric) {
    if (!c) return null;
    switch (metric) {
      case 'MQL_S1': return c.mqls ? c.s1 / c.mqls : null;
      case 'S1_S2': return c.s1 ? c.s2 / c.s1 : null;
      case 'S2_CW': return c.s2 ? c.cw / c.s2 : null;
      case 'ROI': return c.spend ? c.arr / c.spend : null;
      default: return c[metric] || 0;
    }
  }
  function metricFmt(v, metric) {
    if (v === null || v === undefined) return '—';
    if (['MQL_S1', 'S1_S2', 'S2_CW'].includes(metric)) return pct(v);
    if (metric === 'ROI') return Number(v).toFixed(2) + 'x';
    if (['spend', 'arr'].includes(metric)) return money(v);
    return num(v);
  }

  function renderPivotTable(rows) {
    const metricBoxes = Array.from(document.querySelectorAll('input[name="pivot-metric"]:checked')).map(b => b.value);
    const freq = document.getElementById('pivot-freq').value;
    const selChannels = Array.from(document.querySelectorAll('#pivot-channels input[type="checkbox"]:checked')).map(b => b.value);
    const channels = selChannels.length ? selChannels : Array.from(new Set(rows.map(r => r.deal_channel).filter(Boolean))).sort();
    const periods = Array.from(new Set(rows.map(r => freq === 'month' ? monthOf(r.week) : r.week).filter(Boolean))).sort();

    if (!metricBoxes.length) {
      document.getElementById('detail-table').innerHTML = '<div class="muted">Select at least one metric.</div>';
      return;
    }
    if (!periods.length || !channels.length) {
      document.getElementById('detail-table').innerHTML = '<div class="muted">No rows match the current filters.</div>';
      return;
    }

    const cells = new Map();
    rows.forEach(r => {
      if (!channels.includes(r.deal_channel)) return;
      const p = freq === 'month' ? monthOf(r.week) : r.week;
      const k = r.deal_channel + '||' + p;
      if (!cells.has(k)) cells.set(k, { impressions: 0, clicks: 0, spend: 0, mqls: 0, s1: 0, s2: 0, cw: 0, arr: 0 });
      const a = cells.get(k);
      ['impressions','clicks','spend','mqls','s1','s2','cw','arr'].forEach(k => a[k] += r[k] || 0);
    });

    const tables = metricBoxes.map(metric => {
      const head = '<tr><th>' + METRIC_LABELS[metric] + ' · Channel</th>' + periods.map(p => '<th>' + p + '</th>').join('') + '<th>Total</th></tr>';
      const body = channels.map(ch => {
        let total = { impressions: 0, clicks: 0, spend: 0, mqls: 0, s1: 0, s2: 0, cw: 0, arr: 0 };
        const tds = periods.map(p => {
          const c = cells.get(ch + '||' + p);
          if (c) { ['impressions','clicks','spend','mqls','s1','s2','cw','arr'].forEach(k => total[k] += c[k]); }
          return '<td>' + metricFmt(metricVal(c, metric), metric) + '</td>';
        }).join('');
        return '<tr><td>' + ch + '</td>' + tds + '<td><strong>' + metricFmt(metricVal(total, metric), metric) + '</strong></td></tr>';
      }).join('');
      return '<div style="margin-bottom:18px;"><table><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
    }).join('');

    document.getElementById('detail-table').innerHTML = tables;
  }

  // Enforce max-5 on metric checkboxes
  document.querySelectorAll('input[name="pivot-metric"]').forEach(cb => {
    cb.addEventListener('change', () => {
      const checked = document.querySelectorAll('input[name="pivot-metric"]:checked');
      if (checked.length > 5) { cb.checked = false; alert('Choose up to 5 metrics.'); }
    });
  });

  function rerender() {
    const rows = getFiltered();
    document.getElementById('funnel-sub').textContent =
      `${rows.length} rows · ${new Set(rows.map(r => r.deal_channel)).size} channels · ${new Set(rows.map(r => r.week)).size} weeks · ${selected(sourceSel).length ? selected(sourceSel).join(', ') : 'All sources'}`;
    renderKPIs(totals(rows));
    renderFunnelTable(rows);
    renderPivotTable(rows);
    renderDrillDown(rows);
  }

  // Populate the drill-down deal-channel selector with ALL + HubSpot channels (default Paid Social)
  const drillSel = document.getElementById('drill-channel');
  fillSelect(drillSel, ['ALL', ...allChannels]);
  if (allChannels.includes('Paid Social')) drillSel.value = 'Paid Social';

  ['change', 'input'].forEach(evt => {
    [fromInput, toInput,
     document.getElementById('filter-groupby'),
     document.getElementById('pivot-freq'),
     document.getElementById('drill-channel'),
     document.getElementById('drill-window')].forEach(el => el && el.addEventListener(evt, rerender));
  });
  // Delegated listeners for checkbox-group filters and pivot metric/channel checkboxes
  [sourceSel, channelSel, subSel, document.getElementById('pivot-channels')].forEach(c => c && c.addEventListener('change', rerender));
  document.querySelectorAll('input[name="pivot-metric"]').forEach(cb => cb.addEventListener('change', rerender));

  document.getElementById('filter-reset').addEventListener('click', () => {
    fromInput.value = minWeek || '';
    toInput.value = maxWeek || '';
    [sourceSel, channelSel, subSel].forEach(c => c.querySelectorAll('input[type="checkbox"]').forEach(b => b.checked = false));
    document.getElementById('filter-groupby').value = 'create_date';
    rerender();
  });

  rerender();
</script>
</body>
</html>
