  <script>
    const raw = document.getElementById('dashboard-data').textContent;
    const json = raw.replace(/\/\* DASHBOARD_DATA_START \*\//, '').replace(/\/\* DASHBOARD_DATA_END \*\//, '').trim();
    const data = JSON.parse(json);

    document.getElementById('subtitle').textContent = 'Generated at ' + data.generated_at;

    function pct(x) { if (x === null || x === undefined) return '—'; return (x*100).toFixed(1) + '%'; }
    function num(x) { if (x === null || x === undefined) return '—'; return Number(x).toLocaleString(); }
    function money(x) { if (x === null || x === undefined) return '—'; return '$' + Number(x).toLocaleString(undefined, {maximumFractionDigits: 0}); }
    function delta(x) { if (x === null || x === undefined) return '—'; const cls = x >= 0 ? 'pos' : 'neg'; return '<span class="'+cls+'">' + (x*100).toFixed(1) + '%</span>'; }

    function renderAlerts(containerId, alerts, severities) {
      const c = document.getElementById(containerId);
      c.innerHTML = '';
      alerts.filter(a => severities.includes(a.severity)).forEach(a => {
        const d = document.createElement('div');
        d.className = 'alert ' + a.severity;
        d.textContent = '[' + a.severity.toUpperCase() + '] ' + a.message;
        c.appendChild(d);
      });
    }

    renderAlerts('alerts-container', data.alerts, ['red', 'yellow', 'green']);
    renderAlerts('alerts-funnel', data.alerts, ['red', 'yellow']);
    renderAlerts('alerts-roi', data.alerts.filter(a => a.metric === 'ROI'), ['green']);

    function renderFunnelTable() {
      const cols = ['channel','week','spend','leads','mqls','s1','s2','cw','CpCW','ROI','spend_wow_delta'];
      const headers = ['Channel','Week','Spend','Leads','MQLs','S1','S2','CW','CpCW','ROI','Spend WoW'];
      const rows = data.rows.map(r => `<tr>
        <td>${r.channel ?? ''}</td>
        <td>${r.week ?? ''}</td>
        <td>${money(r.spend)}</td>
        <td>${num(r.leads)}</td>
        <td>${num(r.mqls)}</td>
        <td>${num(r.s1)}</td>
        <td>${num(r.s2)}</td>
        <td>${num(r.cw)}</td>
        <td>${money(r.CpCW)}</td>
        <td>${r.ROI === null || r.ROI === undefined ? '—' : Number(r.ROI).toFixed(2) + 'x'}</td>
        <td>${delta(r.spend_wow_delta)}</td>
      </tr>`).join('');
      document.getElementById('funnel-table').innerHTML =
        `<table><thead><tr>${headers.map(h=>'<th>'+h+'</th>').join('')}</tr></thead><tbody>${rows}</tbody></table>`;
    }

    function renderRoiTable() {
      const sorted = [...data.rows].filter(r => r.ROI !== null && r.ROI !== undefined).sort((a,b)=>b.ROI - a.ROI).slice(0,10);
      const rows = sorted.map(r => `<tr>
        <td>${r.channel}</td>
        <td>${r.week}</td>
        <td>${money(r.spend)}</td>
        <td>${money(r.arr ?? null)}</td>
        <td>${Number(r.ROI).toFixed(2)}x</td>
      </tr>`).join('');
      document.getElementById('roi-table').innerHTML =
        `<table><thead><tr><th>Channel</th><th>Week</th><th>Spend</th><th>ARR</th><th>ROI</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    renderFunnelTable();
    renderRoiTable();
  </script>
