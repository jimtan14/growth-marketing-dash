<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AirOps · Growth Marketing Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter+Tight:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --forest: #002910;
      --primary-green: #008c44;
      --interaction-green: #00ff64;
      --accent-label: #EEFF8C;
      --green-100: #dfeae3;
      --green-200: #CCFFE0;
      --off-white: #F8FFFA;
      --near-black: #000d05;
      --text-primary: #09090b;
      --text-secondary: #676c79;
      --text-tertiary: #a5aab6;
      --stroke-primary: #ecedef;
      --stroke-green: #d4e8da;
      --bg-canvas: #f4f4f6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 400;
      padding: 28px 32px;
    }
    .mono { font-family: "DM Mono", monospace; }

    /* Top bar */
    .topbar { display: grid; grid-template-columns: 80px 1fr auto; gap: 12px; align-items: center; margin-bottom: 12px; }
    .logo-tile {
      width: 80px; height: 64px;
      background: var(--forest);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      padding: 8px;
    }
    .logo-tile img { max-width: 100%; max-height: 100%; }
    .title-tile {
      background: #fff;
      border-radius: 10px;
      padding: 18px 22px;
      font-family: "Inter Tight", sans-serif;
      font-weight: 600;
      font-size: 20px;
      color: var(--near-black);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .date-pill {
      background: #fff;
      border-radius: 10px;
      padding: 18px 22px;
      font-family: "Inter Tight", sans-serif;
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .date-pill strong { color: var(--near-black); font-weight: 600; }

    /* Filter bar */
    .filter-bar {
      background: #fff;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: repeat(6, 1fr) auto;
      gap: 14px;
      align-items: end;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field label {
      font-family: "DM Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .field input,
    .field select {
      font-family: "Inter Tight", sans-serif;
      font-size: 13px;
      color: var(--text-primary);
      padding: 8px 10px;
      border: 1px solid var(--stroke-primary);
      border-radius: 7px;
      background: #fff;
      outline: none;
      width: 100%;
    }
    .field input:focus, .field select:focus { border-color: var(--primary-green); box-shadow: 0 0 0 3px var(--green-200); }
    .field select[multiple] { min-height: 38px; max-height: 110px; }
    .reset-btn {
      font-family: "Inter Tight", sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 16px;
      background: var(--near-black);
      color: #fff;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      height: fit-content;
    }
    .reset-btn:hover { background: var(--primary-green); }

    /* KPI tiles */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
      margin-bottom: 14px;
    }
    .kpi {
      background: #fff;
      border-radius: 10px;
      padding: 18px 20px;
      min-height: 98px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .kpi .v {
      font-family: "Inter Tight", sans-serif;
      font-weight: 600;
      font-size: 30px;
      color: var(--near-black);
      line-height: 1.05;
      letter-spacing: -0.01em;
    }
    .kpi .l {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 6px;
    }

    /* Tables */
    .table-card {
      background: #fff;
      border-radius: 12px;
      padding: 18px 22px;
      margin-bottom: 18px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .table-card h2 { font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: 16px; margin: 0 0 4px; }
    .table-card .sub { color: var(--text-secondary); font-size: 12px; margin-bottom: 14px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 13px; }
    thead th {
      text-align: right;
      font-family: "Inter Tight", sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--near-black);
      background: var(--bg-canvas);
      padding: 12px 14px;
      border: 0;
    }
    thead th:first-child { text-align: left; border-radius: 7px 0 0 7px; }
    thead th:last-child { border-radius: 0 7px 7px 0; }
    tbody td {
      text-align: right;
      padding: 12px 14px;
      background: var(--bg-canvas);
      color: var(--text-primary);
      border: 0;
    }
    tbody td:first-child { text-align: left; border-radius: 7px 0 0 7px; font-weight: 500; }
    tbody td:last-child { border-radius: 0 7px 7px 0; }
    tbody tr:hover td { background: #ebebed; }
    .muted { color: var(--text-tertiary); }
    .pos { color: var(--primary-green); font-weight: 500; }
    .neg { color: #c0392b; font-weight: 500; }

    @media (max-width: 1240px) {
      .filter-bar { grid-template-columns: repeat(3, 1fr); }
      .kpi-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 720px) {
      body { padding: 16px; }
      .filter-bar { grid-template-columns: 1fr 1fr; }
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .topbar { grid-template-columns: 60px 1fr; }
      .date-pill { grid-column: 1 / -1; }
    }
  </style>
</head>

      <option value="event_date">Event Date</option>

</div>

<div class="kpi-grid">

</div>

  <div class="sub" id="funnel-sub"></div>
  <div id="funnel-table"></div>
</div>

<div class="table-card">
  <h2>Channel × time pivot</h2>
  <div class="sub" style="display:flex; gap:14px; align-items:end; flex-wrap:wrap; margin-bottom: 16px;">
    <div class="field">
      <label for="pivot-metric">Metric</label>
      <select id="pivot-metric" style="padding:8px 10px; border:1px solid var(--stroke-primary); border-radius:7px; font-size:13px;">
        <option value="spend">Cost</option>
        <option value="impressions">Impressions</option>
        <option value="clicks">Clicks</option>
        <option value="mqls" selected>MQL</option>
        <option value="s1">S1</option>
        <option value="s2">S2</option>
        <option value="cw">CW</option>
        <option value="arr">ARR</option>
        <option value="MQL_S1">MQL → S1 CVR</option>
        <option value="S1_S2">S1 → S2 CVR</option>
        <option value="S2_CW">S2 → CW CVR</option>
        <option value="ROI">ROI</option>
      </select>
    </div>
    <div class="field">
      <label for="pivot-freq">Frequency</label>
      <select id="pivot-freq" style="padding:8px 10px; border:1px solid var(--stroke-primary); border-radius:7px; font-size:13px;">
        <option value="week" selected>Weekly</option>
        <option value="month">Monthly</option>
      </select>
    </div>
    <div class="field" style="min-width:240px; flex:1;">
      <label for="pivot-channels">Channels (rows)</label>
      <select id="pivot-channels" multiple style="padding:8px 10px; border:1px solid var(--stroke-primary); border-radius:7px; font-size:13px; min-height:38px; max-height:110px;"></select>
    </div>
  </div>
  <div id="detail-table"></div>
</div>

<div class="table-card">

<script>
  const raw = document.getElementById('dashboard-data').textContent;
  const json = raw.replace(/\/\* DASHBOARD_DATA_START \*\//, '').replace(/\/\* DASHBOARD_DATA_END \*\//, '').trim();
  const data = JSON.parse(json);

  // Outbound deals come from deal_channel == "Outbound"; everything else is Inbound.
  data.rows.forEach(r => {
    r.source = (r.deal_channel === 'Outbound') ? 'Outbound' : 'Inbound';
  });

  function num(x) { if (x === null || x === undefined || Number.isNaN(x)) return '—'; return Number(x).toLocaleString(); }
  function money(x) { if (x === null || x === undefined || Number.isNaN(x)) return '—'; return '$' + Number(x).toLocaleString(undefined, { maximumFractionDigits: 0 }); }
  function pct(x) { if (x === null || x === undefined || Number.isNaN(x)) return '—'; return (x * 100).toFixed(2) + '%'; }
  function delta(x) { if (x === null || x === undefined || Number.isNaN(x)) return '<span class="muted">—</span>'; const cls = x >= 0 ? 'pos' : 'neg'; return '<span class="' + cls + '">' + (x > 0 ? '+' : '') + (x * 100).toFixed(1) + '%</span>'; }

  // Canonical HubSpot taxonomies (deal_channel, deal_source_2024 enums)
  const HUBSPOT_DEAL_CHANNELS = [
    'Outbound', 'Event / Conference', 'Affiliate', 'AI Search',
    'Community / Influencer', 'Direct', 'Email', 'Offline Advertising',
    'Organic Search', 'Organic Social', 'Paid AI Search', 'Paid Display',
    'Paid Search', 'Paid Social', 'Referral', 'Other',
  ];
  const HUBSPOT_DEAL_SUB_CHANNELS = [
    'Inbound - Network Referral [Name]', 'Inbound - Customer Referral [Name]',
    'Inbound - Partner Referral: [Name]', 'Inbound – Partner Co-Marketing',
    'Inbound - Referral / WOM', 'Inbound - Webinar', 'Inbound - LinkedIn',
    'Inbound - Affiliate', 'Inbound - Community / Newsletter / Influencer',
    'Inbound - Content / SEO / LLMs', 'Enablement - Cohort',
    'Outbound - LinkedIn Dripify Sequence', 'Outbound - Conference',
    'Outbound - Founder Connection', 'Outbound - Email Sequence',
    'Outbound - Event/Dinner Program', 'Outbound - GTN LI Outreach',
    'Product-Led Opp - Intercom', 'Product-Led Opp - Builder Slack',
    'Product-Led Opp - Email Sequence', 'LLM', 'ChatGPT', 'Bing',
    'Growth Unhinged', 'Meta', 'Hubspot Automation', 'G2',
    'Inbound - Other', 'Unknown', 'Phone Call',
  ];

  // Build filter dropdowns
  const allSources = ['Inbound', 'Outbound'];
  const allChannels = HUBSPOT_DEAL_CHANNELS;
  const allSubChannels = HUBSPOT_DEAL_SUB_CHANNELS;
  const allWeeks = Array.from(new Set(data.rows.map(r => r.week).filter(Boolean))).sort();
  const minWeek = allWeeks[0];
  const maxWeek = allWeeks[allWeeks.length - 1];

  function fillSelect(sel, opts) {
    sel.innerHTML = '';
    opts.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); });
  }
  const sourceSel = document.getElementById('filter-source');
  const channelSel = document.getElementById('filter-channel');
  const subSel = document.getElementById('filter-subchannel');
  fillSelect(sourceSel, allSources);
  fillSelect(channelSel, allChannels);
  fillSelect(subSel, allSubChannels);
  const pivotChanSel = document.getElementById('pivot-channels');
  if (pivotChanSel) fillSelect(pivotChanSel, allChannels);

  const fromInput = document.getElementById('filter-from');
  const toInput = document.getElementById('filter-to');
  if (minWeek) { fromInput.value = minWeek; fromInput.min = minWeek; fromInput.max = maxWeek; }
  if (maxWeek) { toInput.value = maxWeek; toInput.min = minWeek; toInput.max = maxWeek; }

  function selected(sel) { return Array.from(sel.selectedOptions).map(o => o.value); }

  function getFiltered() {
    const from = fromInput.value;
    const to = toInput.value;
    const srcs = selected(sourceSel);
    const chans = selected(channelSel);
    const subs = selected(subSel);
    return data.rows.filter(r => {
      if (from && r.week && r.week < from) return false;
      if (to && r.week && r.week > to) return false;
      if (srcs.length && !srcs.includes(r.source)) return false;
      if (chans.length && !chans.includes(r.deal_channel)) return false;
      if (subs.length && !subs.includes(r.deal_sub_channel)) return false;
      return true;
    });
  }

  function totals(rows) {
    const t = { impressions: 0, clicks: 0, spend: 0, leads: 0, mqls: 0, s1: 0, s2: 0, cw: 0, arr: 0 };
    rows.forEach(r => {
      t.impressions += r.impressions || 0;
      t.clicks += r.clicks || 0;
      t.spend += r.spend || 0;
      t.leads += r.leads || 0;
      t.mqls += r.mqls || 0;
      t.s1 += r.s1 || 0;
      t.s2 += r.s2 || 0;
      t.cw += r.cw || 0;
      t.arr += r.arr || 0;
    });
    // Oppty pipeline = pipeline value from S1+S2 stages (we approximate using arr field as deal amount sum).
    // For a proper "pipeline value" we'd want sum of amount across all open deals; using arr (closed-won amount) is a placeholder.
    t.oppty_pipeline = t.arr; // TODO: sum amount across S1+S2 stages once exposed
    t.CTR = t.impressions ? t.clicks / t.impressions : null;
    t.MQL_CVR = t.clicks ? t.mqls / t.clicks : null;
    t.MQL_S1 = t.mqls ? t.s1 / t.mqls : null;
    t.S1_S2 = t.s1 ? t.s2 / t.s1 : null;
    t.Cost_per_MQL = t.mqls ? t.spend / t.mqls : null;
    t.CPS1 = t.s1 ? t.spend / t.s1 : null;
    t.CPS2 = t.s2 ? t.spend / t.s2 : null;
    return t;
  }

  function renderKPIs(t) {
    document.getElementById('kpi-cost').textContent = money(t.spend);
    document.getElementById('kpi-impr').textContent = num(t.impressions);
    document.getElementById('kpi-clicks').textContent = num(t.clicks);
    document.getElementById('kpi-mql').textContent = num(t.mqls);
    document.getElementById('kpi-demo').textContent = num(t.s1);
    document.getElementById('kpi-oppty').textContent = num(t.s2);
    document.getElementById('kpi-ctr').textContent = pct(t.CTR);
    document.getElementById('kpi-mqlcvr').textContent = pct(t.MQL_CVR);
    document.getElementById('kpi-mqldemo').textContent = pct(t.MQL_S1);
    document.getElementById('kpi-s1s2').textContent = pct(t.S1_S2);
    document.getElementById('kpi-cpmql').textContent = money(t.Cost_per_MQL);
    document.getElementById('kpi-cpdemo').textContent = money(t.CPS2);
    document.getElementById('kpi-cac').textContent = money(t.CPS1);
  }

  function aggBy(rows, keyFn) {
    const map = new Map();
    rows.forEach(r => {
      const k = keyFn(r);
      if (!map.has(k)) map.set(k, { key: k, impressions: 0, clicks: 0, spend: 0, leads: 0, mqls: 0, s1: 0, s2: 0, cw: 0, arr: 0 });
      const a = map.get(k);
      a.impressions += r.impressions || 0;
      a.clicks += r.clicks || 0;
      a.spend += r.spend || 0;
      a.leads += r.leads || 0;
      a.mqls += r.mqls || 0;
      a.s1 += r.s1 || 0;
      a.s2 += r.s2 || 0;
      a.cw += r.cw || 0;
      a.arr += r.arr || 0;
    });
    map.forEach(a => {
      a.CTR = a.impressions ? a.clicks / a.impressions : null;
      a.MQL_CVR = a.clicks ? a.mqls / a.clicks : null;
      a.MQL_S1 = a.mqls ? a.s1 / a.mqls : null;
      a.S1_S2 = a.s1 ? a.s2 / a.s1 : null;
      a.S2_CW = a.s2 ? a.cw / a.s2 : null;
      a.MQL_Demo = a.mqls ? a.s2 / a.mqls : null;
      a.Cost_per_MQL = a.mqls ? a.spend / a.mqls : null;
      a.CpCW = a.cw ? a.spend / a.cw : null;
      a.ROI = a.spend ? a.arr / a.spend : null;
    });
    return Array.from(map.values());
  }

  let funnelSort = { col: 'spend', dir: 'desc' };
  function renderFunnelTable(rows) {
    const agg = aggBy(rows, r => r.deal_channel || '—');
    const cols = [
      { key: 'key', label: 'Deal Channel', fmt: v => v, type: 'str' },
      { key: 'spend', label: 'Cost', fmt: money, type: 'num' },
      { key: 'impressions', label: 'Impr.', fmt: num, type: 'num' },
      { key: 'clicks', label: 'Clicks', fmt: num, type: 'num' },
      { key: 'CTR', label: 'CTR', fmt: pct, type: 'num' },
      { key: 'mqls', label: 'MQL', fmt: num, type: 'num' },
      { key: 's1', label: 'S1', fmt: num, type: 'num' },
      { key: 'MQL_S1', label: 'MQL→S1', fmt: pct, type: 'num' },
      { key: 's2', label: 'S2', fmt: num, type: 'num' },
      { key: 'S1_S2', label: 'S1→S2', fmt: pct, type: 'num' },
      { key: 'cw', label: 'CW', fmt: num, type: 'num' },
      { key: 'S2_CW', label: 'S2→CW', fmt: pct, type: 'num' },
      { key: 'ROI', label: 'ROI', fmt: v => v === null ? '—' : Number(v).toFixed(2) + 'x', type: 'num' },
    ];
    const sortKey = funnelSort.col;
    const dir = funnelSort.dir === 'asc' ? 1 : -1;
    agg.sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (av === null || av === undefined) return 1;
      if (bv === null || bv === undefined) return -1;
      if (typeof av === 'string') return av.localeCompare(bv) * dir;
      return (av - bv) * dir;
    });
    const head = cols.map(c => {
      const arrow = funnelSort.col === c.key ? (funnelSort.dir === 'asc' ? ' ↑' : ' ↓') : '';
      return `<th data-col="${c.key}" style="cursor:pointer; user-select:none;">${c.label}${arrow}</th>`;
    }).join('');
    const body = agg.map(r => '<tr>' + cols.map(c => `<td>${c.fmt(r[c.key])}</td>`).join('') + '</tr>').join('');
    document.getElementById('funnel-table').innerHTML =
      `<table><thead><tr>${head}</tr></thead><tbody>${body || '<tr><td colspan="13" class="muted">No rows match the current filters.</td></tr>'}</tbody></table>`;
    document.querySelectorAll('#funnel-table th').forEach(th => {
      th.addEventListener('click', () => {
        const c = th.getAttribute('data-col');
        if (funnelSort.col === c) funnelSort.dir = funnelSort.dir === 'asc' ? 'desc' : 'asc';
        else { funnelSort.col = c; funnelSort.dir = 'desc'; }
        renderFunnelTable(rows);
      });
    });
  }

  function renderSubDetailTable(rows) {
    const sorted = [...rows].sort((a, b) => (b.spend || 0) - (a.spend || 0)).slice(0, 60);
    const headers = ['Deal Channel', 'Sub-Channel', 'Week', 'Cost', 'Clicks', 'MQL', 'S1', 'S2', 'CW', 'ROI', 'WoW Spend'];
    const body = sorted.map(r => `<tr>
      <td>${r.deal_channel || '—'}</td>
      <td>${r.deal_sub_channel || '—'}</td>
      <td class="mono">${r.week || '—'}</td>
      <td>${money(r.spend)}</td>
      <td>${num(r.clicks)}</td>
      <td>${num(r.mqls)}</td>
      <td>${num(r.s1)}</td>
      <td>${num(r.s2)}</td>
      <td>${num(r.cw)}</td>
      <td>${r.ROI === null || r.ROI === undefined ? '—' : Number(r.ROI).toFixed(2) + 'x'}</td>
      <td>${delta(r.spend_wow_delta)}</td>
    </tr>`).join('');
    document.getElementById('subdetail-table').innerHTML =
      `<table><thead><tr>${headers.map(h => '<th>' + h + '</th>').join('')}</tr></thead><tbody>${body || '<tr><td colspan="11" class="muted">No rows match the current filters.</td></tr>'}</tbody></table>`;
  }

  function monthOf(week) { return week ? week.slice(0, 7) : ''; }

  function renderPivotTable(rows) {
    const metric = document.getElementById('pivot-metric').value;
    const freq = document.getElementById('pivot-freq').value;
    const selChannels = Array.from(document.getElementById('pivot-channels').selectedOptions).map(o => o.value);
    const channels = selChannels.length ? selChannels : Array.from(new Set(rows.map(r => r.deal_channel).filter(Boolean))).sort();
    const periods = Array.from(new Set(rows.map(r => freq === 'month' ? monthOf(r.week) : r.week).filter(Boolean))).sort();
    if (!periods.length || !channels.length) {
      document.getElementById('detail-table').innerHTML = '<div class="muted">No rows match the current filters.</div>';
      return;
    }
    const cells = new Map();
    rows.forEach(r => {
      if (!channels.includes(r.deal_channel)) return;
      const p = freq === 'month' ? monthOf(r.week) : r.week;
      const k = r.deal_channel + '||' + p;
      if (!cells.has(k)) cells.set(k, { impressions: 0, clicks: 0, spend: 0, mqls: 0, s1: 0, s2: 0, cw: 0, arr: 0 });
      const a = cells.get(k);
      a.impressions += r.impressions || 0;
      a.clicks += r.clicks || 0;
      a.spend += r.spend || 0;
      a.mqls += r.mqls || 0;
      a.s1 += r.s1 || 0;
      a.s2 += r.s2 || 0;
      a.cw += r.cw || 0;
      a.arr += r.arr || 0;
    });
    function metricVal(c) {
      if (!c) return null;
      switch (metric) {
        case 'MQL_S1': return c.mqls ? c.s1 / c.mqls : null;
        case 'S1_S2': return c.s1 ? c.s2 / c.s1 : null;
        case 'S2_CW': return c.s2 ? c.cw / c.s2 : null;
        case 'ROI': return c.spend ? c.arr / c.spend : null;
        default: return c[metric] || 0;
      }
    }
    function format(v) {
      if (v === null || v === undefined) return '—';
      if (['MQL_S1', 'S1_S2', 'S2_CW'].includes(metric)) return pct(v);
      if (metric === 'ROI') return Number(v).toFixed(2) + 'x';
      if (['spend', 'arr'].includes(metric)) return money(v);
      return num(v);
    }
    const head = '<tr><th>Channel</th>' + periods.map(p => '<th>' + p + '</th>').join('') + '<th>Total</th></tr>';
    const body = channels.map(ch => {
      let total = { impressions: 0, clicks: 0, spend: 0, mqls: 0, s1: 0, s2: 0, cw: 0, arr: 0 };
      const tds = periods.map(p => {
        const c = cells.get(ch + '||' + p);
        if (c) { ['impressions','clicks','spend','mqls','s1','s2','cw','arr'].forEach(k => total[k] += c[k]); }
        return '<td>' + format(metricVal(c)) + '</td>';
      }).join('');
      return '<tr><td>' + ch + '</td>' + tds + '<td><strong>' + format(metricVal(total)) + '</strong></td></tr>';
    }).join('');
    document.getElementById('detail-table').innerHTML =
      '<table><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
  }

  function rerender() {
    const rows = getFiltered();
    document.getElementById('date-range').textContent = (fromInput.value || '—') + ' to ' + (toInput.value || '—');
    document.getElementById('funnel-sub').textContent =
      `${rows.length} rows · ${new Set(rows.map(r => r.deal_channel)).size} channels · ${new Set(rows.map(r => r.week)).size} weeks · ${selected(sourceSel).length ? selected(sourceSel).join(', ') : 'All sources'}`;
    renderKPIs(totals(rows));
    renderFunnelTable(rows);
    renderPivotTable(rows);
    renderSubDetailTable(rows);
  }

  ['change', 'input'].forEach(evt => {
    [fromInput, toInput, sourceSel, channelSel, subSel,
     document.getElementById('filter-groupby'),
     document.getElementById('pivot-metric'),
     document.getElementById('pivot-freq'),
     document.getElementById('pivot-channels')].forEach(el => el.addEventListener(evt, rerender));
  });
  document.getElementById('filter-reset').addEventListener('click', () => {
    fromInput.value = minWeek || '';
    toInput.value = maxWeek || '';
    [sourceSel, channelSel, subSel].forEach(s => Array.from(s.options).forEach(o => o.selected = false));
    document.getElementById('filter-groupby').value = 'create_date';
    rerender();
  });

  rerender();
</script>
</body>
</html>
